name: cloudless-print-bridge

services:
  mqtt-puppeteer:
    image: ${REGISTRY}/${COMPOSE_PROJECT_NAME}/mqtt-puppeteer:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      CLOUDLESS_AUTH_MODE: ${CLOUDLESS_AUTH_MODE:-disabled}
      CLOUDLESS_AUTH_SHARED_SECRET: ${CLOUDLESS_AUTH_SHARED_SECRET:-}
      CLOUDLESS_AUTH_SERVICE_ORDER: ${CLOUDLESS_AUTH_SERVICE_ORDER:-mqtt-puppeteer,ftps-remote-manager,video-service-hub}
      CLOUDLESS_AUTH_TOKEN_TTL_SECONDS: ${CLOUDLESS_AUTH_TOKEN_TTL_SECONDS:-86400}
      MQTT_PUPPETEER_HOST: 0.0.0.0
      MQTT_PUPPETEER_PORT: 10220
      MQTT_PUPPETEER_MQTT_HOST: ${MQTT_PUPPETEER_MQTT_HOST:-}
      MQTT_PUPPETEER_MQTT_PORT: ${MQTT_PUPPETEER_MQTT_PORT:-8883}
      MQTT_PUPPETEER_MQTT_USERNAME: ${MQTT_PUPPETEER_MQTT_USERNAME:-bblp}
      MQTT_PUPPETEER_MQTT_PASSWORD: ${MQTT_PUPPETEER_MQTT_PASSWORD:-}
      MQTT_PUPPETEER_PRINTER_SN: ${MQTT_PUPPETEER_PRINTER_SN:-}
      MQTT_PUPPETEER_MQTT_REJECT_UNAUTHORIZED: ${MQTT_PUPPETEER_MQTT_REJECT_UNAUTHORIZED:-false}
      MQTT_PUPPETEER_MQTT_CONNECT_TIMEOUT_MS: ${MQTT_PUPPETEER_MQTT_CONNECT_TIMEOUT_MS:-10000}
      MQTT_PUPPETEER_MQTT_RECONNECT_PERIOD_MS: ${MQTT_PUPPETEER_MQTT_RECONNECT_PERIOD_MS:-4000}
      MQTT_PUPPETEER_MQTT_KEEPALIVE_SECONDS: ${MQTT_PUPPETEER_MQTT_KEEPALIVE_SECONDS:-60}
      MQTT_PUPPETEER_OPERATION_TIMEOUT_MS: ${MQTT_PUPPETEER_OPERATION_TIMEOUT_MS:-30000}
    ports:
      - "10220:10220"

  ftps-remote-manager:
    image: ${REGISTRY}/${COMPOSE_PROJECT_NAME}/ftps-remote-manager:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      CLOUDLESS_AUTH_MODE: ${CLOUDLESS_AUTH_MODE:-disabled}
      CLOUDLESS_AUTH_SHARED_SECRET: ${CLOUDLESS_AUTH_SHARED_SECRET:-}
      CLOUDLESS_AUTH_SERVICE_ORDER: ${CLOUDLESS_AUTH_SERVICE_ORDER:-mqtt-puppeteer,ftps-remote-manager,video-service-hub}
      CLOUDLESS_AUTH_TOKEN_TTL_SECONDS: ${CLOUDLESS_AUTH_TOKEN_TTL_SECONDS:-86400}
      FTPS_REMOTE_MANAGER_HOST: 0.0.0.0
      FTPS_REMOTE_MANAGER_PORT: 10221
      FTPS_REMOTE_MANAGER_FTP_HOST: ${FTPS_REMOTE_MANAGER_FTP_HOST:-}
      FTPS_REMOTE_MANAGER_FTP_PORT: ${FTPS_REMOTE_MANAGER_FTP_PORT:-990}
      FTPS_REMOTE_MANAGER_FTP_USER: ${FTPS_REMOTE_MANAGER_FTP_USER:-bblp}
      FTPS_REMOTE_MANAGER_FTP_PASSWORD: ${FTPS_REMOTE_MANAGER_FTP_PASSWORD:-}
      FTPS_REMOTE_MANAGER_FTP_TLS_MODE: ${FTPS_REMOTE_MANAGER_FTP_TLS_MODE:-implicit}
      FTPS_REMOTE_MANAGER_FTP_TLS_FINGERPRINT256: ${FTPS_REMOTE_MANAGER_FTP_TLS_FINGERPRINT256:-}
      FTPS_REMOTE_MANAGER_FTP_TIMEOUT_MS: ${FTPS_REMOTE_MANAGER_FTP_TIMEOUT_MS:-10000}
      FTPS_REMOTE_MANAGER_FTP_MAX_CONCURRENT_SESSIONS: ${FTPS_REMOTE_MANAGER_FTP_MAX_CONCURRENT_SESSIONS:-1}
      FTPS_REMOTE_MANAGER_FTP_UPLOAD_MAX_BYTES: ${FTPS_REMOTE_MANAGER_FTP_UPLOAD_MAX_BYTES:-262144000}
    ports:
      - "10221:10221"

  video-service-hub:
    image: ${REGISTRY}/${COMPOSE_PROJECT_NAME}/video-service-hub:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      CLOUDLESS_AUTH_MODE: ${CLOUDLESS_AUTH_MODE:-disabled}
      CLOUDLESS_AUTH_SHARED_SECRET: ${CLOUDLESS_AUTH_SHARED_SECRET:-}
      CLOUDLESS_AUTH_SERVICE_ORDER: ${CLOUDLESS_AUTH_SERVICE_ORDER:-mqtt-puppeteer,ftps-remote-manager,video-service-hub}
      CLOUDLESS_AUTH_TOKEN_TTL_SECONDS: ${CLOUDLESS_AUTH_TOKEN_TTL_SECONDS:-86400}
      VIDEO_SERVICE_HUB_HOST: 0.0.0.0
      VIDEO_SERVICE_HUB_PORT: 10222
      VIDEO_SERVICE_HUB_STORAGE_PATH: /data
      VIDEO_SERVICE_HUB_CAPTURE_MAX_BYTES: ${VIDEO_SERVICE_HUB_CAPTURE_MAX_BYTES:-20971520}
      VIDEO_SERVICE_HUB_RECORDING_PART_MAX_BYTES: ${VIDEO_SERVICE_HUB_RECORDING_PART_MAX_BYTES:-16777216}
      VIDEO_SERVICE_HUB_AUDIO_MAX_BYTES: ${VIDEO_SERVICE_HUB_AUDIO_MAX_BYTES:-10485760}
      VIDEO_SERVICE_HUB_LIVE_MAX_BYTES: ${VIDEO_SERVICE_HUB_LIVE_MAX_BYTES:-1073741824}
      VIDEO_SERVICE_HUB_LIVE_VIEWER_BUFFER_BYTES: ${VIDEO_SERVICE_HUB_LIVE_VIEWER_BUFFER_BYTES:-2097152}
      VIDEO_SERVICE_HUB_CAMERA_COMMAND_TIMEOUT_MS: ${VIDEO_SERVICE_HUB_CAMERA_COMMAND_TIMEOUT_MS:-10000}
      VIDEO_SERVICE_HUB_MQTT_PORT: ${VIDEO_SERVICE_HUB_MQTT_PORT:-1883}
      VIDEO_SERVICE_HUB_MQTT_URL: ${VIDEO_SERVICE_HUB_MQTT_URL:-}
      VIDEO_SERVICE_HUB_MQTT_USERNAME: ${VIDEO_SERVICE_HUB_MQTT_USERNAME:-}
      VIDEO_SERVICE_HUB_MQTT_PASSWORD: ${VIDEO_SERVICE_HUB_MQTT_PASSWORD:-}
      VIDEO_SERVICE_HUB_MQTT_CONNECT_TIMEOUT_MS: ${VIDEO_SERVICE_HUB_MQTT_CONNECT_TIMEOUT_MS:-10000}
      VIDEO_SERVICE_HUB_MQTT_RECONNECT_PERIOD_MS: ${VIDEO_SERVICE_HUB_MQTT_RECONNECT_PERIOD_MS:-1000}
      VIDEO_SERVICE_HUB_MQTT_CAMERA_ONLINE_TTL_MS: ${VIDEO_SERVICE_HUB_MQTT_CAMERA_ONLINE_TTL_MS:-60000}
    ports:
      - "10222:10222"
      - "1883:1883"
    volumes:
      - video-service-hub-data:/data

  octo-management-dashboard:
    image: ${REGISTRY}/${COMPOSE_PROJECT_NAME}/octo-management-dashboard:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - mqtt-puppeteer
      - ftps-remote-manager
      - video-service-hub
    ports:
      - "10200:10200"

volumes:
  video-service-hub-data:
