name: Release to GHCR

on:
  push:
    tags:
      - "release_*.*.*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag in release_X.Y.Z format
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-pipeline
  cancel-in-progress: false

jobs:
  context:
    runs-on: self-hosted
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - id: release
        name: Resolve immutable release identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="${RELEASE_TAG:-$REF_NAME}"
          fi
          [[ "$release_tag" =~ ^release_[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $release_tag" >&2; exit 2; }
          git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null || { echo "Git tag does not exist: $release_tag" >&2; exit 2; }
          sha="$(git rev-list -n 1 "$release_tag")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve release tag to a commit" >&2; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: context
    uses: ./.github/workflows/_job_build.yaml
    with:
      sha: ${{ needs.context.outputs.sha }}

  matrix:
    needs: [context, build]
    runs-on: self-hosted
    timeout-minutes: 3
    outputs:
      projects: ${{ steps.config.outputs.projects }}
      registry: ${{ steps.config.outputs.registry }}
      runner_labels: ${{ steps.config.outputs.runner_labels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.context.outputs.sha }}
      - id: config
        shell: bash
        run: |
          set -euo pipefail
          cfg=.github/ci/projects.json
          bash .github/steps/validate_projects.sh "$cfg"
          echo "projects=$(jq -c '{include: [.projects[] | {project: .}]}' "$cfg")" >> "$GITHUB_OUTPUT"
          echo "registry=$(jq -r '.deploy.registry' "$cfg")" >> "$GITHUB_OUTPUT"
          echo "runner_labels=$(jq -c '.pipeline.runner_labels' "$cfg")" >> "$GITHUB_OUTPUT"

  release:
    name: GHCR / ${{ matrix.project.name }}
    needs: [context, build, matrix]
    runs-on: ${{ fromJSON(needs.matrix.outputs.runner_labels) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.context.outputs.sha }}
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable release
        shell: bash
        env:
          LOCAL_REGISTRY: ${{ needs.matrix.outputs.registry }}
          IMAGE: ${{ matrix.project.image }}
          SOURCE_SHA: ${{ needs.context.outputs.sha }}
          RELEASE_TAG: ${{ needs.context.outputs.release_tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: bash .github/steps/push_image_ghcr.sh

  github_release:
    name: GitHub Release / ${{ needs.context.outputs.release_tag }}
    needs: [context, matrix, release]
    runs-on: ${{ fromJSON(needs.matrix.outputs.runner_labels) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.context.outputs.sha }}

      - name: Create repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.context.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.context.outputs.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          PROJECTS_JSON: ${{ needs.matrix.outputs.projects }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#release_}"
          api="https://api.github.com/repos/${REPOSITORY}/releases"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          api_header="X-GitHub-Api-Version: 2022-11-28"

          existing_status="$(
            curl --silent --show-error --output existing-release.json --write-out "%{http_code}" \
              --url "${api}/tags/${RELEASE_TAG}" \
              --header "$auth_header" \
              --header "Accept: application/vnd.github+json" \
              --header "$api_header"
          )"

          if [ "$existing_status" = "200" ]; then
            jq -r '"GitHub Release already exists: " + .html_url' existing-release.json
            exit 0
          fi

          if [ "$existing_status" != "404" ]; then
            cat existing-release.json >&2
            exit 1
          fi

          body="$(
            jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$SOURCE_SHA" \
              --arg owner "${GHCR_OWNER,,}" \
              --arg version "$version" \
              --argjson matrix "$PROJECTS_JSON" \
              '{
                tag_name: $tag,
                target_commitish: $sha,
                name: $tag,
                draft: false,
                prerelease: false,
                body: (
                  "GHCR images published from commit `" + $sha + "`:\n\n" +
                  ([ $matrix.include[].project.image | "- `ghcr.io/" + $owner + "/" + . + ":" + $version + "`" ] | join("\n"))
                )
              }'
          )"

          status="$(
            curl --silent --show-error --output response.json --write-out "%{http_code}" \
              --request POST \
              --url "$api" \
              --header "$auth_header" \
              --header "Accept: application/vnd.github+json" \
              --header "$api_header" \
              --data "$body"
          )"

          if [ "$status" = "201" ]; then
            jq -r '"Created GitHub Release: " + .html_url' response.json
            exit 0
          fi

          cat response.json >&2
          exit 1
