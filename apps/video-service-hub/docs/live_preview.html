<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Podgląd kamery</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #f5f5f5;
        background: #111;
        font-family: system-ui, sans-serif;
      }

      #stream {
        display: none;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }

      form {
        width: min(440px, calc(100vw - 32px));
        padding: 24px;
        display: grid;
        gap: 14px;
        border: 1px solid #3c3c3c;
        border-radius: 12px;
        background: #202020;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }

      input,
      button {
        padding: 10px 12px;
        border: 1px solid #555;
        border-radius: 7px;
        color: inherit;
        background: #151515;
        font: inherit;
      }

      button {
        border-color: #2675d8;
        background: #1769cc;
        cursor: pointer;
      }

      #settingsButton {
        position: fixed;
        top: 12px;
        right: 12px;
        display: none;
        z-index: 1;
      }

      #status {
        min-height: 20px;
        margin: 0;
        color: #bdbdbd;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <form id="settingsForm">
      <h1>Połącz ze streamem</h1>

      <label>
        videoServiceBaseUrl
        <input
          id="videoServiceBaseUrl"
          type="url"
          value="http://192.168.1.101:10322"
          placeholder="http://192.168.1.101:10322"
          required
          autofocus
        />
      </label>

      <label>
        cameraId
        <input
          id="cameraId"
          value="dcda0c74d028"
          placeholder="dcda0c74d028"
          required
        />
      </label>

      <label>
        requestId (opcjonalnie)
        <input id="requestId" value="liveERT" placeholder="live-001" />
      </label>

      <button type="submit">Pokaż live</button>
      <p id="status">Najpierw uruchom start-live dla kamery.</p>
    </form>

    <button id="settingsButton" type="button">Zmień połączenie</button>
    <img id="stream" alt="Live z kamery" />

    <script>
      const form = document.querySelector('#settingsForm');
      const stream = document.querySelector('#stream');
      const status = document.querySelector('#status');
      const settingsButton = document.querySelector('#settingsButton');

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const baseUrl = document
          .querySelector('#videoServiceBaseUrl')
          .value.trim()
          .replace(/\/+$/, '');
        const cameraId = document.querySelector('#cameraId').value.trim();
        const requestId = document.querySelector('#requestId').value.trim();
        const query = requestId
          ? `?requestId=${encodeURIComponent(requestId)}`
          : '';

        status.textContent = 'Łączenie ze streamem…';
        stream.src = `${baseUrl}/api/v1/cameras/${encodeURIComponent(cameraId)}/live${query}`;
        stream.style.display = 'block';
        form.style.display = 'none';
        settingsButton.style.display = 'block';
      });

      stream.addEventListener('load', () => {
        status.textContent = 'Stream jest aktywny.';
      });

      stream.addEventListener('error', () => {
        stream.removeAttribute('src');
        stream.style.display = 'none';
        form.style.display = 'grid';
        settingsButton.style.display = 'none';
        status.textContent =
          'Nie udało się otworzyć streamu. Sprawdź dane i czy live jest aktywny.';
      });

      settingsButton.addEventListener('click', () => {
        stream.removeAttribute('src');
        stream.style.display = 'none';
        form.style.display = 'grid';
        settingsButton.style.display = 'none';
        status.textContent = 'Wprowadź nowe dane połączenia.';
      });
    </script>
  </body>
</html>
