map $http_upgrade $mqtt_upgrade {
  default "";
  websocket "websocket";
}

map $http_upgrade $mqtt_connection_upgrade {
  default "";
  websocket "upgrade";
}

server {
  listen 10300;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server. Resolving upstream hostnames through it at
  # REQUEST time (via the $mqtt_upstream/etc. variables below), rather than
  # once when nginx loads this config, is required here: `depends_on` in
  # compose.yml only orders container start, it doesn't guarantee the
  # dependency's DNS entry is already registered — a `proxy_pass` to a bare
  # hostname resolves at config-load time and fails nginx's startup outright
  # ("host not found in upstream") if that race is lost. A variable forces
  # per-request resolution, which retries instead of hard-failing at boot,
  # and additionally tolerates the upstream container's IP changing later
  # (e.g. after a restart) without an nginx reload.
  resolver 127.0.0.11 valid=10s;

  location /api/mqtt/ {
    set $mqtt_upstream http://mqtt-puppeteer:10320;
    # No trailing slash / URI part on proxy_pass here, unlike the ftps/video
    # blocks below: mqtt-puppeteer's own main.ts calls
    # app.setGlobalPrefix('api/mqtt'), so it expects requests at
    # /api/mqtt/... itself and 404s on the bare path. A proxy_pass with a
    # trailing slash strips the matched /api/mqtt/ location prefix before
    # forwarding (the normal, desired behavior for ftps/video below, whose
    # backends have no such prefix) — here that stripping would produce
    # exactly the double-negative that breaks every request. Omitting the
    # URI part forwards the original request URI unchanged instead.
    proxy_pass $mqtt_upstream;
    # Upgrade/Connection below are only forwarded for real WebSocket requests:
    # the $mqtt_upgrade / $mqtt_connection_upgrade maps above resolve to empty
    # strings unless $http_upgrade is exactly "websocket", so h2c smuggling
    # via a forged Upgrade header is not possible here.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $mqtt_upgrade;
    proxy_set_header Connection $mqtt_connection_upgrade;
  }

  location /api/ftps/ {
    set $ftps_upstream http://ftps-remote-manager:10321;
    # Public reverse-proxy endpoint reached directly by the frontend; the
    # upstream is a fixed, hardcoded compose service name, not attacker-
    # influenced, so this isn't an SSRF vector. `internal` would block the
    # legitimate direct client requests this location exists to serve.
    # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    #
    # proxy_pass's own location-prefix-stripping (the trailing slash below)
    # does not fire when the target is a variable like $ftps_upstream —
    # nginx forwards only the URI part written after the variable, which is
    # empty, so every request collapsed to a bare "/" at the upstream. The
    # rewrite performs the same stripping explicitly before proxy_pass runs.
    rewrite ^/api/ftps/(.*)$ /$1 break;
    proxy_pass $ftps_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/video/ {
    set $video_upstream http://video-service-hub:10322;
    # See /api/ftps/ above: fixed upstream, publicly reachable by design.
    # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    rewrite ^/api/video/(.*)$ /$1 break;
    proxy_pass $video_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
