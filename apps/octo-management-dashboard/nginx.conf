server {
  listen 10200;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/mqtt/ {
    proxy_pass http://mqtt-puppeteer:10220/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/ftps/ {
    proxy_pass http://ftps-remote-manager:10221/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/video/ {
    proxy_pass http://video-service-hub:10222/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
