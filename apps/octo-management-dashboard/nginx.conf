map $http_upgrade $mqtt_upgrade {
  default "";
  websocket "websocket";
}

map $http_upgrade $mqtt_connection_upgrade {
  default "";
  websocket "upgrade";
}

server {
  listen 10300;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/mqtt/ {
    proxy_pass http://mqtt-puppeteer:10320/;
    # Upgrade/Connection below are only forwarded for real WebSocket requests:
    # the $mqtt_upgrade / $mqtt_connection_upgrade maps above resolve to empty
    # strings unless $http_upgrade is exactly "websocket", so h2c smuggling
    # via a forged Upgrade header is not possible here.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $mqtt_upgrade;
    proxy_set_header Connection $mqtt_connection_upgrade;
  }

  location /api/ftps/ {
    proxy_pass http://ftps-remote-manager:10321/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/video/ {
    proxy_pass http://video-service-hub:10322/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
