<section class="camera-panel">
  <header>
    <span class="eyebrow">Kamera na żywo</span>
    <span class="status"><i></i> Stream aktywny</span>
  </header>
  <dl>
    @for (metric of metrics(); track metric.label) {
      <div><dt>{{ metric.label }}</dt><dd>{{ metric.value }}</dd></div>
    }
  </dl>

  <div class="source-heading">
    <div><span class="eyebrow">Źródła kamery</span><small>{{ sources().length }} dostępne</small></div>
    <p-button icon="pi pi-plus" [rounded]="true" [outlined]="true" size="small" ariaLabel="Dodaj kamerę" />
  </div>
  <div class="sources">
    @for (source of sources(); track source.id) {
      <button type="button" class="source" [class.source--selected]="source.id === selectedSourceId()" (click)="sourceSelected.emit(source.id)">
        <span class="source-icon"><i class="pi pi-video"></i><b [class.offline]="source.status === 'offline'"></b></span>
        <span><strong>{{ source.name }}</strong><small>{{ source.location }}</small></span>
        @if (source.id === selectedSourceId()) { <i class="pi pi-check selected-check"></i> }
      </button>
    }
  </div>
</section>
