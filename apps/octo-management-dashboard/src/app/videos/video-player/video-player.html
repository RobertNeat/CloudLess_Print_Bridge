<section class="player">
  <div class="video-frame">
    <div class="player-actions">
      <p-select
        [options]="resolutionOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="player().resolution"
        (ngModelChange)="resolutionChanged.emit($event)"
        [ariaLabel]="i18n.t('videos.resolutionAria')"
      />
      <p-button
        [icon]="player().active ? 'pi pi-stop' : 'pi pi-play'"
        [label]="i18n.t(player().active ? 'videos.stop' : 'videos.start')"
        [severity]="player().active ? 'danger' : 'primary'"
        [disabled]="!player().active && !canStart()"
        (onClick)="activeChanged.emit(!player().active)"
      />
    </div>
    @if (player().active) {
      <img [src]="previewUrl()" [alt]="i18n.t('videos.previewAlt', { name: sourceName() })" />
    } @else {
      <div class="stream-ended" role="status">
        <span><i class="pi pi-video" aria-hidden="true"></i></span
        ><strong>{{ i18n.t(canStart() ? 'videos.streamStopped' : 'videos.streamOffline') }}</strong
        ><small>{{ i18n.t(canStart() ? 'videos.streamHint' : 'videos.streamOfflineHint') }}</small>
      </div>
    }
  </div>
</section>
