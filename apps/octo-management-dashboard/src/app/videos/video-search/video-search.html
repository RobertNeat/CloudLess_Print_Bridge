<div class="video-search" role="search" [attr.aria-label]="i18n.t('videos.searchAria')">
  <div class="filter-control">
    <button
      pButton
      type="button"
      icon="pi pi-calendar"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [outlined]="!!filters.date()"
      [attr.aria-label]="i18n.t('videos.filterByDate')"
      [attr.aria-expanded]="openFilter() === 'date'"
      aria-controls="video-date-popover"
      (click)="toggle('date')"
    ></button>
    @if (openFilter() === 'date') {
      <div id="video-date-popover" class="filter-popover filter-popover--date" role="group">
        <label for="video-date-filter">{{ i18n.t('videos.recordingDate') }}</label>
        <input
          id="video-date-filter"
          type="date"
          [ngModel]="filters.date()"
          (ngModelChange)="filters.setDate($event)"
        />
      </div>
    }
  </div>

  <div class="filter-control">
    <button
      pButton
      type="button"
      icon="pi pi-video"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [outlined]="!!filters.sourceId()"
      [attr.aria-label]="i18n.t('videos.filterBySource')"
      [attr.aria-expanded]="openFilter() === 'source'"
      aria-controls="video-source-popover"
      (click)="toggle('source')"
    ></button>
    @if (openFilter() === 'source') {
      <div id="video-source-popover" class="filter-popover filter-popover--source" role="group">
        <label for="video-source-filter">{{ i18n.t('videos.cameraSource') }}</label>
        <p-select
          inputId="video-source-filter"
          [options]="filters.sources()"
          [ngModel]="filters.sourceId()"
          (ngModelChange)="filters.setSourceId($event ?? '')"
          optionLabel="name"
          optionValue="id"
          [placeholder]="i18n.t('videos.allCameras')"
          [showClear]="true"
          appendTo="body"
        />
      </div>
    }
  </div>

  <span class="search-input">
    <i class="pi pi-search" aria-hidden="true"></i>
    <input
      pInputText
      type="search"
      [ngModel]="filters.query()"
      (ngModelChange)="filters.setQuery($event)"
      [placeholder]="i18n.t('videos.searchPlaceholder')"
      [attr.aria-label]="i18n.t('videos.searchInputAria')"
    />
  </span>
</div>
