<section class="preview">
  <header><div><span class="live-dot" [class.live-dot--active]="preview().active"></span><strong>{{ preview().cameraName }}</strong></div><div class="preview-actions"><p-select [options]="preview().availableResolutions" [ngModel]="preview().resolution" (ngModelChange)="resolutionChanged.emit($event)" size="small" ariaLabel="Rozdzielczość podglądu" /><button pButton type="button" size="small" [severity]="preview().active ? 'danger' : 'primary'" [outlined]="preview().active" [icon]="preview().active ? 'pi pi-stop' : 'pi pi-play'" [label]="preview().active ? 'Zatrzymaj' : 'Uruchom'" (click)="activeChanged.emit(!preview().active)"></button></div></header>
  <div class="camera-frame">
    @if (preview().active) {
      <img src="/images/live_preview.png" alt="Podgląd z kamery drukarki" />
    } @else {
      <div class="camera-off" role="img" aria-label="Kamera drukarki jest wyłączona">
        <span><i class="pi pi-camera" aria-hidden="true"></i></span>
      </div>
    }
  </div>
</section>
