<section
  id="printer-quick-controls"
  class="controls"
  data-testid="printer-quick-controls"
  [attr.aria-label]="i18n.t('controls.aria')"
>
  <button
    id="quick-control-light-toggle"
    type="button"
    class="control"
    data-testid="quick-control-light-toggle"
    [class.control--active]="lightEnabled()"
    [attr.aria-pressed]="lightEnabled()"
    [attr.aria-label]="i18n.t(lightEnabled() ? 'controls.lightOnAria' : 'controls.lightOffAria')"
    (click)="toggleLight()"
  >
    <span class="icon icon--light"
      ><i
        [class]="lightEnabled() ? 'pi pi-lightbulb' : 'pi pi-power-off'"
        aria-hidden="true"
      ></i></span
    ><span
      ><small>{{ i18n.t('controls.light') }}</small></span
    >
  </button>
  <button
    id="quick-control-fans-trigger"
    #fanTrigger
    type="button"
    class="control"
    data-testid="quick-control-fans-trigger"
    [class.control--active]="fansEnabled()"
    (click)="fanPopover.toggle($event, fanTrigger)"
  >
    <span class="icon"><i class="pi pi-cog" aria-hidden="true"></i></span
    ><span
      ><small>{{ i18n.t('controls.fans') }}</small
      ><strong id="quick-control-fan-speed-label">{{
        fansEnabled() ? fanSpeed() + '%' : i18n.t('controls.off')
      }}</strong></span
    ><i class="pi pi-chevron-down chevron" aria-hidden="true"></i>
  </button>
  <button
    id="quick-control-speed-trigger"
    #speedTrigger
    type="button"
    class="control"
    data-testid="quick-control-speed-trigger"
    (click)="speedPopover.toggle($event, speedTrigger)"
  >
    <span class="icon"><i class="pi pi-gauge" aria-hidden="true"></i></span
    ><span
      ><small>{{ i18n.t('controls.printSpeed') }}</small
      ><strong id="quick-control-speed-label">{{ speedLabel(printSpeed()) }}</strong></span
    ><i class="pi pi-chevron-down chevron" aria-hidden="true"></i>
  </button>
</section>
<p-popover #fanPopover styleClass="printer-control-popover">
  <div id="quick-control-fan-popover" class="popover-panel" data-testid="quick-control-fan-popover">
    <div class="popover-row">
      <strong>{{ i18n.t('controls.fans') }}</strong
      ><button
        id="quick-control-fan-power-toggle"
        type="button"
        class="power"
        data-testid="quick-control-fan-power-toggle"
        [class.power--on]="fansEnabled()"
        (click)="toggleFans()"
      >
        {{ i18n.t(fansEnabled() ? 'controls.on' : 'controls.off') }}
      </button>
    </div>
    <div class="popover-row">
      <span>{{ i18n.t('controls.speed') }}</span
      ><strong id="quick-control-fan-speed-value">{{ fanSpeed() }}%</strong>
    </div>
    <p-slider
      id="quick-control-fan-speed-slider"
      [ngModel]="fanSpeed()"
      (ngModelChange)="setFanSpeed($event)"
      [step]="10"
      [attr.aria-label]="i18n.t('controls.fanSpeedAria')"
    />
  </div>
</p-popover>
<p-popover #speedPopover styleClass="printer-control-popover">
  <div
    id="quick-control-speed-popover"
    class="speed-list"
    data-testid="quick-control-speed-popover"
    role="radiogroup"
    [attr.aria-label]="i18n.t('controls.speedGroupAria')"
  >
    @for (mode of speedModes; track mode) {
      <button
        type="button"
        role="radio"
        [id]="'quick-control-speed-option-' + mode"
        [attr.data-testid]="'quick-control-speed-option-' + mode"
        [attr.aria-checked]="printSpeed() === mode"
        [class.selected]="printSpeed() === mode"
        (click)="printSpeed.set(mode); speedPopover.hide()"
      >
        <i class="pi pi-bolt" aria-hidden="true"></i>{{ speedLabel(mode) }}
      </button>
    }
  </div>
</p-popover>
