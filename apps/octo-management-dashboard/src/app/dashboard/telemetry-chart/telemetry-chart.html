<section class="chart">
  <header>
    <div>
      <h2>{{ title() }}</h2>
      <p>{{ subtitle() }}</p>
    </div>
  </header>
  <div class="chart__canvas">
    <canvas
      baseChart
      type="line"
      role="img"
      [attr.aria-label]="title() + '. ' + subtitle()"
      [data]="data()"
      [options]="options()"
      [plugins]="plugins"
    ></canvas>
  </div>
</section>
