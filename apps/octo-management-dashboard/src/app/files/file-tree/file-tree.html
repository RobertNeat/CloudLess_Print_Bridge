<aside class="tree-panel">
  <section class="pinned-section">
    <div class="section-heading">
      <span>{{ i18n.t('files.pinned') }}</span>
      <i class="pi pi-star-fill" aria-hidden="true"></i>
    </div>
    <div class="pinned-list">
      @for (location of pinnedLocations(); track location.id) {
        <button
          type="button"
          class="pinned-item"
          [class.pinned-item--active]="selectedFolderPath() === location.path"
          [attr.aria-pressed]="selectedFolderPath() === location.path"
          (click)="selectPinned(location.path)"
        >
          <i [class]="location.icon" aria-hidden="true"></i>
          <span
            ><strong>{{ i18n.t(location.labelKey) }}</strong
            ><small>{{ location.path }}</small></span
          >
          <i class="pi pi-chevron-right" aria-hidden="true"></i>
        </button>
      }
    </div>
  </section>
  <section class="files-section">
    <div class="section-heading">
      <span>{{ i18n.t('files.section') }}</span
      ><span class="section-count">{{ nodes().length }}</span>
    </div>
    <nav class="file-tree" role="tree" [attr.aria-label]="i18n.t('files.treeAria')">
      @for (node of nodes(); track node.id) {
        <ng-container
          [ngTemplateOutlet]="treeNode"
          [ngTemplateOutletContext]="{ $implicit: node, depth: 0 }"
        />
      }
    </nav>
  </section>
</aside>

<ng-template #treeNode let-node let-depth="depth">
  <button
    type="button"
    class="tree-node"
    role="treeitem"
    [class.tree-node--active]="
      selectedFilePath() === node.path ||
      (!selectedFilePath() && selectedFolderPath() === node.path)
    "
    [style.--tree-depth]="depth"
    [attr.aria-level]="depth + 1"
    [attr.aria-selected]="
      selectedFilePath() === node.path ||
      (!selectedFilePath() && selectedFolderPath() === node.path)
    "
    [attr.aria-expanded]="node.type === 'folder' ? isExpanded(node) : null"
    (click)="select(node)"
    (keydown.arrowRight)="expand(node); $event.preventDefault()"
    (keydown.arrowLeft)="collapse(node); $event.preventDefault()"
  >
    @if (node.type === 'folder') {
      @if (isLoading(node.id)) {
        <i class="pi pi-spin pi-spinner tree-chevron" aria-hidden="true"></i>
      } @else {
        <i
          class="pi tree-chevron"
          [class.pi-chevron-down]="isExpanded(node)"
          [class.pi-chevron-right]="!isExpanded(node)"
          aria-hidden="true"
        ></i>
      }
      <i class="pi pi-folder tree-icon" aria-hidden="true"></i>
    } @else {
      <span class="tree-indent"></span><i class="pi pi-file tree-icon" aria-hidden="true"></i>
    }
    <span class="tree-label">{{ node.name }}</span>
  </button>
  @if (node.children?.length && isExpanded(node)) {
    @for (child of node.children; track child.id) {
      <ng-container
        [ngTemplateOutlet]="treeNode"
        [ngTemplateOutletContext]="{ $implicit: child, depth: depth + 1 }"
      />
    }
  }
</ng-template>
