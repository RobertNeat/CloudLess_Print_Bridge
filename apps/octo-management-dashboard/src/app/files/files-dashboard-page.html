<section
  id="files-dashboard"
  class="files-dashboard"
  data-testid="files-dashboard"
  [attr.data-browser-width]="layout.browserWidth()"
  [attr.data-details-position]="layout.detailsPosition()"
>
  @if (dashboard(); as data) {
    <div class="panel panel--tree">
      <app-file-tree
        [pinnedLocations]="data.pinnedLocations"
        [nodes]="data.tree"
        [selectedFolderPath]="selectedFolderPath()"
        [selectedFilePath]="selectedFile()?.path ?? null"
        [failedPaths]="failedPaths()"
        (folderSelected)="selectFolder($event)"
        (fileSelected)="selectFileNode($event)"
        (folderExpandRequested)="handleFolderExpandRequested($event)"
      />
    </div>
    <div class="panel panel--browser">
      <app-file-list
        [files]="visibleFiles()"
        [path]="selectedFolderPath()"
        [selectedFileId]="selectedFile()?.id ?? null"
        (fileSelected)="selectedFile.set($event)"
        (fileAction)="executeFileAction($event)"
      />
    </div>
    <div class="panel panel--details">
      <app-file-details
        [file]="selectedFile()"
        [uploadPath]="selectedFolderPath() || data.uploadPath"
        [statusMessage]="operationMessage()"
        (uploadRequested)="requestUpload()"
      />
    </div>
  } @else if (loadingError()) {
    <div class="dashboard-state">
      <i class="pi pi-exclamation-triangle"></i><strong>{{ i18n.t('files.loadError') }}</strong>
    </div>
  } @else {
    <div class="dashboard-state">
      <i class="pi pi-spin pi-spinner"></i><span>{{ i18n.t('files.loading') }}</span>
    </div>
  }
</section>
