<section class="upload-card">
  <div class="upload-heading">
    <span>{{ i18n.t('files.uploadTo') }}</span
    ><i class="pi pi-upload" aria-hidden="true"></i>
  </div>
  <div class="upload-path">
    <i class="pi pi-folder-open" aria-hidden="true"></i><span>{{ path() }}</span>
  </div>
  <button
    type="button"
    class="drop-zone"
    [class.drop-zone--dragging]="dragging"
    (click)="openFilePicker()"
    (dragenter)="dragging = true"
    (dragleave)="dragging = false"
    (drop)="onDrop($event)"
    (dragover)="$event.preventDefault()"
  >
    <span class="upload-icon"><i class="pi pi-cloud-upload"></i></span
    ><strong>{{ i18n.t('files.dropHere') }}</strong
    ><span>{{ i18n.t('files.browse') }}</span
    ><small>{{ i18n.t('files.maxSize') }}</small>
  </button>
  <input
    #fileInput
    type="file"
    class="visually-hidden-input"
    [attr.aria-label]="i18n.t('files.browse')"
    (change)="onFilePicked($event)"
  />
</section>
