<section class="upload-card">
  <div class="upload-heading">
    <span>Prześlij do lokalizacji</span><i class="pi pi-upload" aria-hidden="true"></i>
  </div>
  <div class="upload-path">
    <i class="pi pi-folder-open"></i><span>{{ path() }}</span>
  </div>
  <button
    type="button"
    class="drop-zone"
    [class.drop-zone--dragging]="dragging"
    (click)="uploadRequested.emit()"
    (dragenter)="dragging = true"
    (dragleave)="dragging = false"
    (drop)="dragging = false; uploadRequested.emit(); $event.preventDefault()"
    (dragover)="$event.preventDefault()"
  >
    <span class="upload-icon"><i class="pi pi-cloud-upload"></i></span
    ><strong>Upuść pliki tutaj</strong><span>lub kliknij, aby przeglądać</span
    ><small>Maksymalnie 5 GB na plik</small>
  </button>
</section>
