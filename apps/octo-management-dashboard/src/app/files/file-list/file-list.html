<section class="browser-panel">
  <header class="browser-header">
    <nav class="breadcrumbs" [attr.aria-label]="i18n.t('files.breadcrumbsAria')">
      <button type="button" class="home-crumb" (click)="breadcrumbSelected.emit('/')">
        <i class="pi pi-home" aria-hidden="true"></i><span>{{ i18n.t('files.home') }}</span>
      </button>
      @for (crumb of breadcrumbs(); track crumb.path) {
        <i class="pi pi-chevron-right" aria-hidden="true"></i>
        <button
          type="button"
          class="crumb"
          [class.current-crumb]="$last"
          (click)="breadcrumbSelected.emit(crumb.path)"
        >
          {{ crumb.label }}
        </button>
      }
    </nav>
    <label class="search-box">
      <i class="pi pi-search" aria-hidden="true"></i>
      <input
        pInputText
        [ngModel]="query()"
        (ngModelChange)="query.set($event)"
        [placeholder]="i18n.t('files.search')"
        [attr.aria-label]="i18n.t('files.search')"
      />
    </label>
  </header>
  <div class="list-summary">
    <span>{{ fileCount(visibleFiles().length) }}</span>
    <button
      type="button"
      class="sort-button"
      [attr.aria-label]="i18n.t(sortAscending() ? 'files.sortDescending' : 'files.sortAscending')"
      (click)="sortAscending.set(!sortAscending())"
    >
      <i
        [class]="sortAscending() ? 'pi pi-sort-amount-up-alt' : 'pi pi-sort-amount-down'"
        aria-hidden="true"
      ></i>
      {{ i18n.t('files.sortName') }}
    </button>
  </div>
  <div class="file-list">
    @for (file of visibleFiles(); track file.id) {
      <div class="file-row" [class.file-row--selected]="selectedFileId() === file.id">
        <button
          type="button"
          class="file-select"
          [attr.aria-pressed]="selectedFileId() === file.id"
          (click)="fileSelected.emit(file)"
        >
          <span class="file-type" [attr.data-kind]="file.kind"
            ><i [class]="fileIcon(file)" aria-hidden="true"></i
            ><small>{{ file.extension }}</small></span
          >
          <span class="file-copy"
            ><strong>{{ file.name }}</strong
            ><small
              >{{ i18n.formatBytes(file.sizeBytes) }} ·
              {{ i18n.formatDateTime(file.modifiedAt) }}</small
            ></span
          >
        </button>
        <button
          type="button"
          class="row-menu-button"
          [attr.aria-label]="i18n.t('files.actions.open', { name: file.name })"
          (click)="menuFile.set(file); fileMenu.toggle($event)"
        >
          <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
        </button>
      </div>
    } @empty {
      <div class="empty-list">
        <i class="pi pi-search" aria-hidden="true"></i
        ><strong>{{ i18n.t('files.emptyTitle') }}</strong
        ><span>{{ i18n.t('files.emptyDescription') }}</span>
      </div>
    }
  </div>
  <p-menu #fileMenu [model]="fileMenuItems()" [popup]="true" appendTo="body" />
</section>
